<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>OG Image Preview</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1e293b;
    }
    .container {
      background: white;
      padding: 20px;
    }
    .og-image {
      width: 1200px;
      height: 630px;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .logo-container {
      margin-bottom: 40px;
    }
    .logo {
      width: 100px;
      height: 100px;
    }
    .brand-name {
      font-size: 72px;
      font-weight: 600;
      color: white;
      letter-spacing: -1px;
      margin-bottom: 20px;
    }
    .tagline {
      font-size: 32px;
      font-weight: 400;
      color: #94a3b8;
      margin-bottom: 15px;
    }
    .subtitle {
      font-size: 24px;
      font-weight: 400;
      color: #64748b;
      margin-bottom: 60px;
    }
    .accent-line {
      width: 400px;
      height: 3px;
      background: #10b981;
      border-radius: 2px;
      position: absolute;
      bottom: 100px;
    }
    /* S logo animation */
    #cut-mask-rect {
      animation: cutReveal 0.16s ease-out forwards;
      animation-delay: 0.5s;
      transform: scaleY(0);
      transform-origin: center;
    }
    @keyframes cutReveal {
      from { transform: scaleY(0); }
      to { transform: scaleY(1); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="og-image" id="ogImage">
      <div class="logo-container">
        <svg class="logo" width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <mask id="og-cut-mask" maskUnits="userSpaceOnUse">
              <rect width="100" height="100" fill="white"/>
              <rect id="cut-mask-rect" x="0" y="54" width="100" height="8" fill="black"/>
            </mask>
          </defs>
          <path
            d="
              M25 18
              H75
              V34
              H42
              V42
              H65
              V82
              H25
              V66
              H58
              V58
              H25
              Z
            "
            fill="white"
            mask="url(#og-cut-mask)"
          />
        </svg>
      </div>
      <div class="brand-name">SoshlOps</div>
      <div class="tagline">Professional social media operations</div>
      <div class="subtitle">Agency-grade management for teams and enterprises</div>
      <div class="accent-line"></div>
    </div>
  </div>

  <script>
    // Instructions for screenshot
    console.log('To create the PNG file:');
    console.log('1. Right-click on the image area');
    console.log('2. Select "Inspect Element"');
    console.log('3. In DevTools, right-click the .og-image div');
    console.log('4. Choose "Capture node screenshot"');
    console.log('5. Save as og-image.png in /public folder');
  </script>
</body>
</html>
