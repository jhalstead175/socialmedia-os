<svg width="1000" height="1000" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <mask id="vault-mask" maskUnits="userSpaceOnUse">
      <rect width="1000" height="1000" fill="white"/>
      <!-- Vertical cut -->
      <rect x="540" y="0" width="80" height="1000" fill="black"/>
    </mask>
  </defs>

  <!-- Outer circle -->
  <circle cx="500" cy="500" r="400" fill="black" mask="url(#vault-mask)"/>
  <!-- Inner void -->
  <circle cx="500" cy="500" r="200" fill="white"/>
</svg>
