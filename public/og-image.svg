<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background matching landing page -->
  <rect width="1200" height="630" fill="#0f172a"/>

  <!-- Logo (S monolith) - centered top -->
  <g transform="translate(550, 100)">
    <defs>
      <mask id="og-cut-mask" maskUnits="userSpaceOnUse">
        <rect width="100" height="100" fill="white"/>
        <rect x="0" y="54" width="100" height="8" fill="black"/>
      </mask>
    </defs>
    <path
      d="
        M25 18
        H75
        V34
        H42
        V42
        H65
        V82
        H25
        V66
        H58
        V58
        H25
        Z
      "
      fill="white"
      mask="url(#og-cut-mask)"
    />
  </g>

  <!-- SoshlOps text -->
  <text
    x="600"
    y="260"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="72"
    font-weight="600"
    fill="white"
    text-anchor="middle"
    letter-spacing="-1"
  >SoshlOps</text>

  <!-- Tagline -->
  <text
    x="600"
    y="340"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="32"
    font-weight="400"
    fill="#94a3b8"
    text-anchor="middle"
  >Professional social media operations</text>

  <!-- Subtitle -->
  <text
    x="600"
    y="390"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="24"
    font-weight="400"
    fill="#64748b"
    text-anchor="middle"
  >Agency-grade management for teams and enterprises</text>

  <!-- Bottom accent line -->
  <line x1="400" y1="500" x2="800" y2="500" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
</svg>
